name: Disposable runtime smoke
on:
  push:
    branches: [feature/trusted-pokemon-riders]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedicated-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Inspect installed Cobblemon riding delegate bytecode
        run: |
          gradle --no-daemon -q resolveRuntimeClasspath
          cobblemon_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1" -path '*/MdwFAVRL/xsVHrAsY/*.jar' -print -quit)
          test -n "$cobblemon_jar"
          echo "Inspecting $cobblemon_jar"
          jar tf "$cobblemon_jar" | grep -iE 'Pokemon(Client|Server)Delegate|PokemonEntity\.class|/Seat\.class' > riding-classes.txt
          cat riding-classes.txt
          sed 's#/#.#g; s#\.class$##' riding-classes.txt \
            | while read -r class_name; do javap -classpath "$cobblemon_jar" -p -c "$class_name"; done \
            > riding-api.log
          grep -E -A80 'positionRider\(|getSeatLocator\(|getPassengerOffsets\(|getSeats\(|Seat\(' riding-api.log
      - name: Add the installed KotlinForForge provider to the disposable run
        run: |
          mkdir -p smoke-run/mods
          versions=$(curl -fsSLG \
            --data-urlencode 'loaders=["neoforge"]' \
            --data-urlencode 'game_versions=["1.21.1"]' \
            https://api.modrinth.com/v2/project/kotlin-for-forge/version)
          url=$(printf '%s' "$versions" | jq -r '.[] | select(.version_number == "5.12.0") | .files[] | select(.primary == true) | .url' | head -n 1)
          test -n "$url"
          curl -fsSL "$url" -o smoke-run/mods/kotlinforforge-5.12.0-all.jar
      - name: Start disposable NeoForge server with Cobblemon 1.8.4
        env:
          JAVA_TOOL_OPTIONS: -Dmixin.debug.verbose=true -Dmixin.debug.export=true
        run: |
          mkdir -p smoke-run
          printf 'eula=true\n' > smoke-run/eula.txt
          timeout --signal=TERM 8m gradle --no-daemon runServer --stacktrace > server-smoke.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 480); do
            if grep -q 'Done (' server-smoke.log; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat server-smoke.log
              exit 1
            fi
            sleep 1
          done
          if ! grep -q 'Done (' server-smoke.log; then
            cat server-smoke.log
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          grep -E 'Done \(|backseatriders\.mixins\.json|PokemonRidingMixin|PokemonSeatFallbackMixin|HorseBackseatMixin' server-smoke.log
          grep -q 'PokemonRidingMixin' server-smoke.log
          grep -q 'PokemonSeatFallbackMixin' server-smoke.log
          grep -q 'HorseBackseatMixin' server-smoke.log
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" || true
      - name: Preserve disposable server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-log-${{ github.sha }}
          path: |
            server-smoke.log
            riding-api.log
            riding-classes.txt
          if-no-files-found: ignore
