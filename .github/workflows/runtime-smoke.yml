name: Disposable runtime smoke
on:
  push:
    branches: [feature/trusted-pokemon-riders]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dedicated-server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
          cache-read-only: false
      - name: Resolve exact Cobblemon 1.8.4 runtime
        run: |
          gradle --no-daemon -q resolveRuntimeClasspath
          cobblemon_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1" -path '*/MdwFAVRL/xsVHrAsY/*.jar' -print -quit)
          test -n "$cobblemon_jar"
          echo "Cobblemon runtime: $cobblemon_jar"
          javap -classpath "$cobblemon_jar" -p com.cobblemon.mod.common.entity.pokemon.PokemonEntity
          javap -classpath "$cobblemon_jar" -c -p com.cobblemon.mod.common.entity.pokemon.PokemonEntity | awk '/^  .*\\);$/ { keep = ($0 ~ /(isRideableFor|tryRidingPokemon|travel|getRiddenInput|getRiddenSpeed|getControllingPassenger|canAddPassenger|addPassenger|tickRidden)\\(/) } keep { print }'
          javap -classpath "$cobblemon_jar" -p com.cobblemon.mod.common.entity.pokemon.PokemonServerDelegate
      - name: Add the installed KotlinForForge provider to disposable runs
        run: |
          mkdir -p smoke-run/mods smoke-gametest/mods smoke-client/mods
          versions=$(curl -fsSLG \
            --data-urlencode 'loaders=["neoforge"]' \
            --data-urlencode 'game_versions=["1.21.1"]' \
            https://api.modrinth.com/v2/project/kotlin-for-forge/version)
          url=$(printf '%s' "$versions" | jq -r '.[] | select(.version_number == "5.12.0") | .files[] | select(.primary == true) | .url' | head -n 1)
          test -n "$url"
          curl -fsSL "$url" -o smoke-run/mods/kotlinforforge-5.12.0-all.jar
          cp smoke-run/mods/kotlinforforge-5.12.0-all.jar smoke-gametest/mods/
          cp smoke-run/mods/kotlinforforge-5.12.0-all.jar smoke-client/mods/
      - name: Start disposable NeoForge server with Cobblemon 1.8.4
        env:
          JAVA_TOOL_OPTIONS: -Dmixin.debug.verbose=true -Dmixin.debug.export=true
        run: |
          mkdir -p smoke-run
          printf 'eula=true\\n' > smoke-run/eula.txt
          timeout --signal=TERM 8m gradle --no-daemon runServer --stacktrace > server-smoke.log 2>&1 &
          server_pid=$!
          for attempt in $(seq 1 480); do
            if grep -q 'Done (' server-smoke.log; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat server-smoke.log; exit 1; fi
            sleep 1
          done
          if ! grep -q 'Done (' server-smoke.log; then
            cat server-smoke.log
            kill "$server_pid" 2>/dev/null || true
            exit 1
          fi
          grep -E 'Done|PokemonRidingMixin|PokemonSeatFallbackMixin|HorseBackseatMixin' server-smoke.log
          grep -q 'PokemonRidingMixin' server-smoke.log
          grep -q 'PokemonSeatFallbackMixin' server-smoke.log
          grep -q 'HorseBackseatMixin' server-smoke.log
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" || true
      - name: Run server-side Cobblemon GameTest integration
        env:
          JAVA_TOOL_OPTIONS: -Dmixin.debug.verbose=true -Dmixin.debug.export=true
        run: |
          mkdir -p smoke-gametest
          printf 'eula=true\\n' > smoke-gametest/eula.txt
          if ! timeout --signal=TERM 8m gradle --no-daemon runGameTestServer --stacktrace > game-test.log 2>&1; then
            cat game-test.log
            exit 1
          fi
          cat game-test.log
          grep -Ei 'fallback|GameTestServer|tests? passed|Done' game-test.log
          grep -q 'PokemonSeatFallbackServerMixin' game-test.log
          grep -q '1 tests are now running' game-test.log
          grep -q 'All 1 required tests passed' game-test.log
      - name: Start isolated client under Xvfb
        env:
          JAVA_TOOL_OPTIONS: -Dmixin.debug.verbose=true
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          set +e
          timeout --signal=TERM 240s xvfb-run -a gradle --no-daemon runClient --stacktrace > client-smoke.log 2>&1
          client_status=$?
          set -e
          if [ "$client_status" -ne 124 ] && [ "$client_status" -ne 143 ]; then
            cat client-smoke.log
            exit "$client_status"
          fi
          grep -E 'PokemonSeatFallbackMixin|Minecraft 1.21.1|Minecraft started' client-smoke.log
          grep -q 'PokemonSeatFallbackMixin' client-smoke.log
      - name: Preserve disposable server and GameTest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-log-${{ github.sha }}
          path: |
            server-smoke.log
            game-test.log
            client-smoke.log
          if-no-files-found: ignore

