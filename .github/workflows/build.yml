name: Build
on:
  push:
    branches: [main, feature/trusted-pokemon-riders]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build mod jar
        run: gradle --no-daemon clean build
      - name: Record JAR checksum
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'backseat-riders-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$jar_path"
          echo "Built artifact: $jar_path"
          sha256sum "$jar_path"
      - uses: actions/upload-artifact@v4
        with:
          name: backseat-riders-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

