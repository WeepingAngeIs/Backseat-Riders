name: Build
on:
  push:
    branches: [main, feature/trusted-pokemon-riders]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build mod jar
        run: gradle --no-daemon clean build
      - name: Inspect Cobblemon riding bytecode
        if: always()
        continue-on-error: true
        run: |
          compile_cp="$(gradle --no-daemon --quiet printCompileClasspath)"
          cobblemon_jar="$(printf '%s' "$compile_cp" | tr ':' '\n' | grep -Ei 'MdwFAVRL|cobblemon' | head -1)"
          if [ -n "$cobblemon_jar" ]; then
            javap -classpath "$cobblemon_jar" -p -c com.cobblemon.mod.common.entity.pokemon.PokemonEntity | sed -n '/isRideableFor(/,/^  public/p' | head -100
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: backseat-riders-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

