plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

group = 'dev.backseatriders'
version = '0.1.0'
base { archivesName = 'backseat-riders' }

repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.249'
    runs {
        configureEach { systemProperty 'neoforge.enabledGameTestNamespaces', 'backseatriders' }
        client { client() }
        server {
            server()
            gameDirectory = project.file('smoke-run')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('smoke-gametest')
            programArgument '--nogui'
        }
    }
    mods { backseatriders { sourceSet sourceSets.main } }
}

dependencies {
    implementation 'org.spongepowered:mixin:0.8.7'
    compileOnly 'maven.modrinth:MdwFAVRL:xsVHrAsY'
    runtimeOnly 'maven.modrinth:MdwFAVRL:xsVHrAsY'
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
}

tasks.register('resolveRuntimeClasspath') {
    doLast { configurations.runtimeClasspath.files.each { println it.absolutePath } }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.withType(Test).configureEach { useJUnitPlatform() }
tasks.jar { manifest { attributes('MixinConfigs': 'backseatriders.mixins.json') } }
